{% extends "_base.html" %}

{% block conteudo %}

<div class="max-w-md mx-auto">

    <div class="mb-6">
        <a href="transacao.php" class="text-sm text-slate-500 hover:text-slate-700 transition-colors flex items-center gap-1 mb-3">
            ← Voltar
        </a>
        <h2 class="text-2xl font-bold text-slate-800">Excluir Transação</h2>
    </div>

    <div class="bg-white border border-slate-200 rounded-xl shadow-sm p-6">

        <div class="flex items-start gap-4 mb-6">
            <div class="bg-red-100 text-red-600 rounded-full w-10 h-10 flex items-center justify-center text-lg flex-shrink-0">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <div>
                <p class="font-semibold text-slate-800 mb-1">Tem certeza que deseja excluir?</p>
                <p class="text-sm text-slate-500">Esta operação não pode ser desfeita.</p>
            </div>
        </div>

        <div class="bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 mb-6">
            <p class="text-xs text-slate-500 uppercase tracking-wide font-semibold mb-1">Transação</p>
            <p class="text-slate-800 font-medium">{{ transacao.descricao }}</p>
        </div>

        <div class="flex gap-3">
            <a href="transacao.php"
                class="flex-1 text-center border border-slate-300 text-slate-700 hover:bg-slate-50 text-sm font-medium py-2.5 rounded-lg transition-colors">
                Cancelar
            </a>
            <form action="transacao_excluir.php" method="post" class="flex-1">
                <input type="hidden" name="id" value="{{ transacao.id }}">
                <button type="submit"
                    class="w-full bg-red-600 hover:bg-red-700 active:scale-[0.98] text-white text-sm font-semibold py-2.5 rounded-lg transition-all">
                    Confirmar Exclusão
                </button>
            </form>
        </div>

    </div>

</div>

{% endblock %}
