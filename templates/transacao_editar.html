{% extends "_base.html" %}

{% block conteudo %}

<div class="max-w-lg mx-auto">

    <div class="mb-6">
        <a href="transacao.php" class="text-sm text-slate-500 hover:text-slate-700 transition-colors flex items-center gap-1 mb-3">
            ← Voltar
        </a>
        <h2 class="text-2xl font-bold text-slate-800">Editar Transação</h2>
        <p class="text-sm text-slate-500 mt-1">Altere os dados da movimentação</p>
    </div>

    {% if erro %}
    <div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-4 py-3 mb-5">
        {{ erro }}
    </div>
    {% endif %}

    <div class="bg-white border border-slate-200 rounded-xl shadow-sm p-6">
        <form action="transacao_editar.php" method="post">
            <input type="hidden" name="id" value="{{ transacao.id }}">

            <div class="mb-4">
                <label for="descricao" class="block text-sm font-medium text-slate-700 mb-1.5">Descrição</label>
                <input type="text" name="descricao" id="descricao" value="{{ transacao.descricao }}" placeholder="Ex: Salário mensal"
                    class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition">
            </div>

            <div class="mb-4">
                <label for="valor" class="block text-sm font-medium text-slate-700 mb-1.5">Valor (R$)</label>
                <input type="number" name="valor" id="valor" value="{{ transacao.valor }}" placeholder="0,00" step="0.01" min="0"
                    class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition">
            </div>

            <div class="mb-4">
                <label for="data_transacao" class="block text-sm font-medium text-slate-700 mb-1.5">Data da Transação</label>
                <input type="date" name="data_transacao" id="data_transacao" value="{{ transacao.data_transacao }}"
                    class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition">
            </div>

            <div class="mb-4">
                <label for="tipo" class="block text-sm font-medium text-slate-700 mb-1.5">Tipo</label>
                <select name="tipo" id="tipo"
                    class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition bg-white">
                    <option value="entrada" {% if transacao.tipo == 'entrada' %}selected{% endif %}>Entrada</option>
                    <option value="saida" {% if transacao.tipo == 'saida' %}selected{% endif %}>Saída</option>
                </select>
            </div>

            <div class="mb-6">
                <label for="categoria" class="block text-sm font-medium text-slate-700 mb-1.5">Categoria</label>
                <select name="categoria" id="categoria"
                    class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition bg-white">
                    {% for key, label in categorias %}
                        <option value="{{ key }}" {% if transacao.categoria == key %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit"
                class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white font-semibold text-sm py-2.5 rounded-lg transition-all">
                Salvar Alterações
            </button>

        </form>
    </div>

</div>

{% endblock %}
